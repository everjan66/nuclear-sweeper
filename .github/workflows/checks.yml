name: Game checks
on: [push, pull_request]
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Four-client simulated soak
        run: node scripts/coop-soak.cjs 2
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.64.0
          python -m playwright install --with-deps ${{ matrix.browser }}
      - name: Four-client WebRTC and process restart
        run: python scripts/browser-smoke.py --managed-server --browser ${{ matrix.browser }} > browser-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: browser-result.json
